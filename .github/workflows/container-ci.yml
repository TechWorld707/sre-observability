name: Container CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "minishop/**"
      - ".github/workflows/container-ci.yml"

  push:
    branches:
      - main
    paths:
      - "minishop/**"
      - ".github/workflows/container-ci.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-scan-publish:
    name: Build and scan ${{ matrix.component }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        component:
          - frontend
          - backend

    env:
      IMAGE_NAME: ghcr.io/techworld707/sre-observability-${{ matrix.component }}:${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: ./minishop/${{ matrix.component }}
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable container image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "${IMAGE_NAME}"